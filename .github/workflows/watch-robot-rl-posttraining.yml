name: Daily Robot RL Post-Training Watch

on:
  schedule:
    # 08:30 America/Los_Angeles year-round. GitHub cron is UTC, so both
    # daylight-time and standard-time slots are declared; the UTC-offset gate
    # below selects exactly one of them without depending on the runner starting
    # at the exact scheduled minute.
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
  # Changes to the watcher or its tests trigger one end-to-end validation run.
  # Report/state commits do not match these paths and therefore do not loop.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/watch-robot-rl-posttraining.yml"
      - "scripts/watch_robot_rl_posttraining.py"
      - "scripts/watch_robot_rl_posttraining_strict.py"
      - "tests/test_robot_rl_watch.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: robot-rl-posttraining-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Select the 08:30 Pacific run
        id: slot
        shell: bash
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual or validation event: running immediately."
            exit 0
          fi

          pacific_offset="$(TZ=America/Los_Angeles date +%z)"
          if [[ "$TRIGGER_SCHEDULE" == "30 15 * * *" && "$pacific_offset" == "-0700" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Selected the daylight-time 08:30 Pacific slot."
          elif [[ "$TRIGGER_SCHEDULE" == "30 16 * * *" && "$pacific_offset" == "-0800" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Selected the standard-time 08:30 Pacific slot."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the inactive DST slot: schedule=$TRIGGER_SCHEDULE offset=$pacific_offset."
          fi

      - name: Checkout
        if: steps.slot.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.slot.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run watcher tests
        if: steps.slot.outputs.run == 'true'
        run: |
          python -m py_compile \
            scripts/watch_robot_rl_posttraining.py \
            scripts/watch_robot_rl_posttraining_strict.py
          python -m unittest discover -s tests -p 'test_robot_rl_watch.py' -v

      - name: Find unseen papers
        if: steps.slot.outputs.run == 'true'
        id: watch
        run: |
          python scripts/watch_robot_rl_posttraining_strict.py \
            --state data/robot_rl_watch_state.json \
            --output-dir outputs/robot_rl_watch \
            --lookback-days 45 \
            --threshold 10 \
            --max-new 30 \
            --timezone America/Los_Angeles

      # Notify before persisting the deduplication state. The hidden report
      # marker makes this step idempotent if a retry occurs after notification.
      - name: Post the daily digest to tracking issue
        if: steps.slot.outputs.run == 'true' && steps.watch.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.watch.outputs.report_path }}
        run: |
          marker="$(head -n 1 "$REPORT_PATH")"
          if gh api \
              "repos/$GITHUB_REPOSITORY/issues/7/comments" \
              --paginate \
              --jq '.[].body' | grep -Fq -- "$marker"; then
            echo "This report is already present in issue #7; skipping duplicate comment."
          else
            gh issue comment 7 \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$REPORT_PATH"
          fi

      - name: Commit report and permanent deduplication state
        if: steps.slot.outputs.run == 'true' && steps.watch.outputs.new_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/robot_rl_watch_state.json outputs/robot_rl_watch
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: add daily robot RL post-training watch"
            git pull --rebase
            git push
          fi

      - name: Write run summary
        if: always()
        run: |
          if [[ "${{ steps.slot.outputs.run }}" != "true" ]]; then
            echo "Skipped the inactive daylight-saving-time slot." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "New papers: ${{ steps.watch.outputs.new_count }}" >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "${{ steps.watch.outputs.report_path }}" ]]; then
              echo "Report: ${{ steps.watch.outputs.report_path }}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No unseen high-relevance papers; no issue notification was sent." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
