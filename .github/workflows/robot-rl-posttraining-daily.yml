name: Robot RL Post-Training Daily Watch

on:
  schedule:
    # Two UTC schedules plus the gate below preserve 08:30 Pacific across DST.
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
  # Changes to this watcher trigger one immediate end-to-end validation run.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/robot-rl-posttraining-daily.yml"
      - "scripts/robot_rl_posttrain_watch.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: robot-rl-posttraining-daily
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Select the active 08:30 Pacific slot
        id: gate
        shell: bash
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual or validation event: running immediately."
            exit 0
          fi

          pacific_offset="$(TZ=America/Los_Angeles date +%z)"
          if [[ "$TRIGGER_SCHEDULE" == "30 15 * * *" && "$pacific_offset" == "-0700" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Selected the daylight-time 08:30 Pacific slot."
          elif [[ "$TRIGGER_SCHEDULE" == "30 16 * * *" && "$pacific_offset" == "-0800" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Selected the standard-time 08:30 Pacific slot."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the inactive daylight-saving-time slot."
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate watcher
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scripts/robot_rl_posttrain_watch.py
          python scripts/robot_rl_posttrain_watch.py --self-test

      - name: Find previously unseen papers
        if: steps.gate.outputs.run == 'true'
        id: watch
        run: |
          python scripts/robot_rl_posttrain_watch.py \
            --state data/robot_rl_posttrain_seen.json \
            --output-dir outputs/robot_rl_posttrain \
            --days 45 \
            --per-query 120 \
            --min-score 12 \
            --max-items 100 \
            --timezone America/Los_Angeles

      # Notification comes before persistence. If it fails, the papers stay
      # unseen and will be retried rather than silently lost.
      - name: Publish digest to canonical tracking issue
        if: steps.gate.outputs.run == 'true' && steps.watch.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.watch.outputs.report_path }}
        shell: bash
        run: |
          paper_ids="$(grep -oE '\[[0-9]{4}\.[0-9]{4,5}\]' "$REPORT_PATH" \
            | tr -d '[]' | sort -u | paste -sd, -)"
          digest="$(printf '%s' "$paper_ids" | sha256sum | cut -c1-16)"
          marker="<!-- robot-rl-posttraining:${digest} -->"
          body_file="$(mktemp)"
          printf '%s\n' "$marker" > "$body_file"
          cat "$REPORT_PATH" >> "$body_file"

          if gh api "repos/$GITHUB_REPOSITORY/issues/7/comments" \
              --paginate --jq '.[].body' | grep -Fq -- "$marker"; then
            echo "Identical paper set is already present in issue #7; skipping duplicate comment."
          else
            gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          fi

      - name: Persist report and permanent deduplication state
        if: steps.gate.outputs.run == 'true' && steps.watch.outputs.has_new == 'true'
        env:
          REPORT_PATH: ${{ steps.watch.outputs.report_path }}
        shell: bash
        run: |
          set -euo pipefail
          state_path="data/robot_rl_posttrain_seen.json"
          report_dir="outputs/robot_rl_posttrain"
          report_name="$(basename "$REPORT_PATH")"

          cp "$state_path" /tmp/robot_rl_local_state.json
          cp "$REPORT_PATH" /tmp/robot_rl_dated_report.md
          cp "$report_dir/latest.md" /tmp/robot_rl_latest_report.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$report_dir" "$(dirname "$state_path")"

            python - "$state_path" /tmp/robot_rl_local_state.json <<'PY'
          import json
          import sys
          from pathlib import Path

          remote_path = Path(sys.argv[1])
          local_path = Path(sys.argv[2])
          local = json.loads(local_path.read_text(encoding="utf-8"))
          if remote_path.exists():
              remote = json.loads(remote_path.read_text(encoding="utf-8"))
          else:
              remote = {"version": 1, "seen": {}}

          merged_seen = dict(remote.get("seen", {}))
          merged_seen.update(local.get("seen", {}))
          merged = dict(remote)
          merged.update({key: value for key, value in local.items() if key != "seen"})
          merged["seen"] = merged_seen
          merged["issue_number"] = 7
          merged["total_unique_papers"] = sum(
              1 for key in merged_seen if key.startswith("arxiv:")
          )
          remote_path.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

            cp /tmp/robot_rl_dated_report.md "$report_dir/$report_name"
            cp /tmp/robot_rl_latest_report.md "$report_dir/latest.md"
            git add "$state_path" "$report_dir/$report_name" "$report_dir/latest.md"

            if git diff --cached --quiet; then
              echo "State and report are already persisted."
              exit 0
            fi

            git commit -m "chore: add daily robot RL post-training digest"
            if git push origin HEAD:main; then
              echo "Persisted on attempt $attempt."
              exit 0
            fi
            echo "Concurrent repository update detected; retrying ($attempt/3)."
            sleep $((attempt * 3))
          done

          echo "Failed to persist after three conflict-safe retries." >&2
          exit 1

      - name: Write run summary
        if: always()
        run: |
          if [[ "${{ steps.gate.outputs.run }}" != "true" ]]; then
            echo "Inactive DST slot skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "New papers: ${{ steps.watch.outputs.new_count }}" >> "$GITHUB_STEP_SUMMARY"
            if [[ "${{ steps.watch.outputs.has_new }}" == "true" ]]; then
              echo "Digest: ${{ steps.watch.outputs.report_path }}" >> "$GITHUB_STEP_SUMMARY"
              echo "Tracking issue: #7" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No unseen high-relevance paper; no notification sent." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
