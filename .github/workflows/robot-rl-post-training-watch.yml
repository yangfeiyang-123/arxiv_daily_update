name: Watch Robot Manipulation RL Post-Training

on:
  schedule:
    # One slot maps to 09:30 PDT and the other to 09:30 PST. The local-hour
    # gate below keeps exactly one daily run through daylight-saving changes.
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      include_backlog:
        description: "Also inspect older unseen papers already present in the recent feeds"
        required: false
        type: boolean
        default: false
  # Workflow, classifier, and test edits receive one immediate validation run.
  # State/report commits do not match these paths, so there is no trigger loop.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/robot-rl-post-training-watch.yml"
      - "scripts/fetch_robot_rl_arxiv.py"
      - "scripts/robot_rl_post_training_watch.py"
      - "tests/test_robot_rl_watch.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: robot-rl-post-training-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Gate scheduled runs to 09:30 Pacific
        id: local_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual or validation run; continuing."
            exit 0
          fi

          LOCAL_HOUR="$(TZ=America/Los_Angeles date +%H)"
          LOCAL_TIME="$(TZ=America/Los_Angeles date +%H:%M)"
          if [ "$LOCAL_HOUR" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Selected the 09:30 America/Los_Angeles slot (${LOCAL_TIME})."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the duplicate DST guard slot (${LOCAL_TIME})."
          fi

      - name: Checkout
        if: steps.local_time.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.local_time.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate watcher code
        if: steps.local_time.outputs.run == 'true'
        run: |
          python -m py_compile \
            scripts/fetch_robot_rl_arxiv.py \
            scripts/robot_rl_post_training_watch.py
          python -m unittest discover -s tests -p 'test_robot_rl_watch.py' -v

      - name: Fetch focused live arXiv candidates
        if: steps.local_time.outputs.run == 'true'
        run: |
          python scripts/fetch_robot_rl_arxiv.py \
            --output /tmp/robot_rl_live.json \
            --days 21 \
            --max-results 150

      - name: Merge broad and focused paper feeds
        if: steps.local_time.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          broad_path = Path("data/latest_cs_daily.json")
          live_path = Path("/tmp/robot_rl_live.json")
          output_path = Path("/tmp/robot_rl_candidates.json")

          papers = []
          broad = json.loads(broad_path.read_text(encoding="utf-8"))
          if isinstance(broad, list):
              papers.extend(item for item in broad if isinstance(item, dict))
          elif isinstance(broad, dict):
              if isinstance(broad.get("fields"), list):
                  for field in broad["fields"]:
                      if isinstance(field, dict) and isinstance(field.get("papers"), list):
                          papers.extend(item for item in field["papers"] if isinstance(item, dict))
              elif isinstance(broad.get("papers"), list):
                  papers.extend(item for item in broad["papers"] if isinstance(item, dict))

          if live_path.exists():
              live = json.loads(live_path.read_text(encoding="utf-8"))
              if isinstance(live, list):
                  papers.extend(item for item in live if isinstance(item, dict))

          output_path.write_text(
              json.dumps(papers, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"Merged {len(papers)} candidate records into {output_path}")
          PY

      - name: Find previously unseen relevant papers
        if: steps.local_time.outputs.run == 'true'
        id: watch
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_backlog }}" = "true" ]; then
            EXTRA="--include-backlog"
          fi

          python scripts/robot_rl_post_training_watch.py \
            --input /tmp/robot_rl_candidates.json \
            --state data/robot_rl_watch_seen.json \
            --report-dir outputs/robot_rl_watch \
            --min-score 13 \
            --max-papers 20 \
            $EXTRA

      # Notify before committing state. If notification fails, the same papers
      # remain eligible for retry instead of being silently marked as delivered.
      - name: Publish digest to canonical tracking issue
        if: >-
          steps.local_time.outputs.run == 'true' &&
          steps.watch.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.watch.outputs.report_path }}
        shell: bash
        run: |
          MARKER="$(head -n 1 "$REPORT_PATH")"
          if gh api "repos/$GITHUB_REPOSITORY/issues/7/comments" --paginate --jq '.[].body' \
            | grep -F -- "$MARKER" >/dev/null; then
            echo "This digest is already present in issue #7; skipping duplicate comment."
          else
            gh issue comment 7 \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$REPORT_PATH"
          fi

      - name: Persist permanent no-repeat state and reports
        if: >-
          steps.local_time.outputs.run == 'true' &&
          steps.watch.outputs.state_changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/robot_rl_watch_seen.json outputs/robot_rl_watch

          if git diff --cached --quiet; then
            echo "No state/report changes to commit."
            exit 0
          fi

          git commit -m "chore: update robot RL post-training watch"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" \
              && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "Failed to persist watch state after three attempts." >&2
          exit 1

      - name: Write run summary
        if: steps.local_time.outputs.run == 'true'
        shell: bash
        run: |
          echo "New papers: ${{ steps.watch.outputs.new_count }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.watch.outputs.report_path }}" ]; then
            echo "Report: ${{ steps.watch.outputs.report_path }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No unseen high-relevance papers; no issue notification was sent." >> "$GITHUB_STEP_SUMMARY"
          fi
