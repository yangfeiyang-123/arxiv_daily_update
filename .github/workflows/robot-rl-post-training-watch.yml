name: Watch Robot Manipulation RL Post-Training

on:
  schedule:
    # 16:30 UTC = 09:30 PDT / 08:30 PST in America/Los_Angeles.
    # This runs well after the repository's 02:30 UTC arXiv feed refresh.
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      include_backlog:
        description: "Also inspect older unseen papers already present in the 30-day feed"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: robot-rl-post-training-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find previously unseen relevant papers
        id: watch
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_backlog }}" = "true" ]; then
            EXTRA="--include-backlog"
          fi

          python scripts/robot_rl_post_training_watch.py \
            --input data/latest_cs_daily.json \
            --state data/robot_rl_watch_seen.json \
            --report-dir outputs/robot_rl_watch \
            --min-score 13 \
            --max-papers 20 \
            $EXTRA

      - name: Publish digest to tracking issue
        if: steps.watch.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.watch.outputs.report_path }}
        run: |
          MARKER="$(head -n 1 "$REPORT_PATH")"
          if gh api "repos/$GITHUB_REPOSITORY/issues/8/comments" --paginate --jq '.[].body' | grep -F -- "$MARKER" >/dev/null; then
            echo "This digest is already present in issue #8; skipping duplicate comment."
          else
            gh issue comment 8 \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$REPORT_PATH"
          fi

      - name: Persist no-repeat state and reports
        if: steps.watch.outputs.state_changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/robot_rl_watch_seen.json outputs/robot_rl_watch

          if git diff --cached --quiet; then
            echo "No state/report changes to commit."
            exit 0
          fi

          git commit -m "chore: update robot RL post-training watch"

          # The feed updater may occasionally finish near this job. Rebase before push
          # so the permanent seen-state is not lost to a harmless branch race.
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "Failed to persist watch state after three attempts." >&2
          exit 1
